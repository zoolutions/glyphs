# The label taxonomy for zoolutions/glyphs — the single source of truth.
#
# `bin/labels sync` makes GitHub match this file; `bin/labels validate` checks it
# offline. The rules live in .github/LABELS.md.
#
# Every label outside the `area` group, and the shared `devops`/`dx`/`docs-site`
# areas, come from docs-kit's labels kit (LABELS_KIT.md) and must stay identical
# to docs-kit's copy (`script/labels-kit check`). The other areas are this repo's.
---
ignore: []

labels:
  # ---------------------------------------------------------------- type ----
  # Exactly one per issue/PR: what kind of work this is.
  - name: bug
    color: d73a4a
    description: Something isn't working
    group: type
  - name: enhancement
    color: a2eeef
    description: New feature or request
    group: type
  - name: performance
    color: fbca04
    description: Faster or leaner with no change in behaviour
    group: type
  - name: tech-debt
    color: 9c27bb
    description: Refactoring or cleanup that pays down an accepted shortcut
    group: type
  - name: security
    color: "e9e257"
    description: Vulnerability, hardening, or an authorization correctness fix
    group: type
  - name: documentation
    color: 0075ca
    description: Improvements or additions to documentation
    group: type
  - name: dependencies
    color: d93f0b
    description: Changes dependencies in some way
    group: type
  - name: chore
    color: ededed
    description: CI, tooling or configuration work with no behaviour change
    group: type

  # ---------------------------------------------------------------- area ----
  # One or more per issue/PR: which part of the code it touches. Shared first.
  - name: devops
    color: 006b75
    description: CI, the release kit, Docker, deploys and infrastructure
    group: area
  - name: dx
    color: 16a085
    description: Developer experience — agent commands and rules, generators, local tooling
    group: area
  - name: docs-site
    color: 2ea44f
    description: The documentation site under docs/
    group: area
  # glyphs's own areas.
  - name: icons
    color: 1d76db
    description: The icon sets, the Icon base component, configuration and the Railtie
    group: area
  - name: pruning
    color: 0366d6
    description: The source scanner and icon pruner, and their rake tasks
    group: area
  - name: rubocop
    color: 7eafec
    description: The bundled RuboCop cops
    group: area

  # -------------------------------------------------------------- status ----
  # Where an issue is in its lifecycle. Never on a pull request.
  - name: plan
    color: 6f42c1
    description: Has a /plan body with Context, Decision, Steps and Gates; ready for /lfg
    group: status
  - name: epic
    color: "5319e7"
    description: Umbrella item tracking several smaller issues
    group: status
  - name: blocker
    color: 8a63d2
    description: Blocks other work or a release until it is resolved
    group: status
  - name: needs-info
    color: d4c5f9
    description: Waiting on details before it can be planned or worked on
    group: status

  # ----------------------------------------------------------- community ----
  # GitHub's defaults, kept because GitHub surfaces them to contributors.
  - name: good first issue
    color: 7057ff
    description: Good for newcomers
    group: community
  - name: help wanted
    color: "008672"
    description: Extra attention is needed
    group: community
  - name: question
    color: d876e3
    description: Further information is requested
    group: community
  - name: duplicate
    color: cfd3d7
    description: This issue or pull request already exists
    group: community
  - name: invalid
    color: "e4e669"
    description: This doesn't seem right
    group: community
  - name: wontfix
    color: ffffff
    description: This will not be worked on
    group: community

# Path globs -> area label, used by `bin/labels infer` and by /plan and /lfg to
# label deterministically from a diff. Matched with File.fnmatch and
# File::FNM_PATHNAME | File::FNM_EXTGLOB: write a recursive glob as `**/*`. A
# path may match several globs — every matching area applies.
paths:
  "lib/glyphs/*_icon.rb": icons
  "lib/glyphs/{icon,icon_reference,configuration,railtie}.rb": icons
  "lib/glyphs/{source_scanner,prune_runner,prune_report,icon_pruner}.rb": pruning
  "lib/tasks/**/*": pruning
  "lib/rubocop/**/*": rubocop
  "lib/glyphs/rubocop.rb": rubocop
  "config/default.yml": rubocop
  "spec/glyphs/{icon,icon_reference,configuration,railtie}_spec.rb": icons
  "spec/glyphs/{source_scanner,prune_runner,prune_report,icon_pruner}_spec.rb": pruning
  "spec/rubocop/**/*": rubocop
  ".github/**/*": devops
  "bin/release": devops
  "rakelib/**/*": devops
  "**/Dockerfile*": devops
  ".claude/**/*": dx
  "{AGENTS,CLAUDE}.md": dx
  "bin/labels": dx
  "docs/**/*": docs-site
